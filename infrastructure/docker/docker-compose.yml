services:
  mongodb:
    image: mongo:7.0
    container_name: civic_mongo
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MONGO_PORT:-27018}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-civic_admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-civic_dev_secret_password}
    volumes:
      - mongo-data:/data/db
      - ../mongo-init/init-databases.js:/docker-entrypoint-initdb.d/init-databases.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')", "-u", "${MONGO_ROOT_USER:-civic_admin}", "-p", "${MONGO_ROOT_PASSWORD:-civic_dev_secret_password}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - civic-network

  redis:
    image: redis:7.2-alpine
    container_name: civic_redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-redis_dev_secret_password}", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_dev_secret_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - civic-network

volumes:
  mongo-data:
    name: civic_pulse_mongo_data
  redis-data:
    name: civic_pulse_redis_data

networks:
  civic-network:
    name: civic_pulse_network
    driver: bridge
